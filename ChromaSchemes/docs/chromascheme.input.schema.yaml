version: 0.3.0
$id: "chromaverse://chromascheme/input"
title: "ChromaSchemeInput"
description: "Input parameters for generating a ChromaScheme."
type: object
required:
  - baseColour
  - geometryModel
properties:
  baseColour:
    type: object
    properties:
      hex:
        type: string
      space:
        type: string
  geometryModel:
    type: string
    enum:
      - quadratic
      - triadic
      - tetradic
      - split_complementary
      - harmonic
      - custom
  overlays:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
        params:
          type: object
  desiredColourCount:
    type: integer
    minimum: 1
    maximum: 24
