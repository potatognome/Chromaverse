name: ChromaGlyphs CI

on:
  push:
    paths:
      - 'ChromaGlyphs/**'
  pull_request:
    paths:
      - 'ChromaGlyphs/**'

defaults:
  run:
    working-directory: ChromaGlyphs

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ChromaGlyphs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage
